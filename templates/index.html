<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub User Explorer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 20px;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .search-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .search-form {
            display: flex;
            gap: 10px;
        }
        
        .search-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .search-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .search-btn:hover {
            background: #5a67d8;
        }
        
        .results {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-top: 30px;
        }
        
        .user-card, .repos-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        .user-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #667eea;
        }
        
        .user-info h2 {
            font-size: 1.8em;
            margin-bottom: 5px;
            color: #333;
        }
        
        .user-info p {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 8px;
        }
        
        .stat-value {
            display: block;
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .details {
            margin-top: 20px;
            color: #555;
        }
        
        .details p {
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .repo-list {
            list-style: none;
        }
        
        .repo-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            transition: background 0.3s;
        }
        
        .repo-item:hover {
            background: #f9f9f9;
        }
        
        .repo-item:last-child {
            border-bottom: none;
        }
        
        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .repo-name {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .repo-name:hover {
            text-decoration: underline;
        }
        
        .repo-stats {
            display: flex;
            gap: 15px;
            color: #666;
            font-size: 0.9em;
        }
        
        .repo-desc {
            color: #555;
            line-height: 1.5;
            margin-top: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #c33;
        }
        
        .github-icon {
            font-size: 2em;
            margin-right: 10px;
        }
        
        @media (max-width: 768px) {
            .results {
                grid-template-columns: 1fr;
            }
            
            .search-form {
                flex-direction: column;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐙 GitHub User Explorer</h1>
            <p>Search for any GitHub user and explore their profile and repositories</p>
        </div>
        
        <div class="search-box">
            <form class="search-form" id="searchForm">
                <input type="text" 
                       class="search-input" 
                       id="usernameInput" 
                       placeholder="Enter GitHub username (e.g., torvalds)" 
                       value="torvalds">
                <button type="submit" class="search-btn">Search</button>
            </form>
        </div>
        
        <div id="resultsContainer" class="results">
            <div class="loading" id="loadingMessage">
                Loading GitHub user data...
            </div>
        </div>
    </div>

    <script>
        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            if (username) {
                await fetchUserData(username);
            }
        });

        async function fetchUserData(username) {
            // Show loading state
            document.getElementById('resultsContainer').innerHTML = `
                <div class="loading" id="loadingMessage">
                    Fetching data for @${username}...
                </div>
            `;

            try {
                // Fetch user info and repos in parallel
                const [userResponse, reposResponse] = await Promise.all([
                    fetch(`/api/user/${username}`),
                    fetch(`/api/repos/${username}`)
                ]);

                if (!userResponse.ok) {
                    throw new Error('User not found');
                }

                const userData = await userResponse.json();
                const reposData = await reposResponse.json();

                displayResults(userData, reposData);
            } catch (error) {
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="error">
                        <h3>Error</h3>
                        <p>${error.message}</p>
                        <p>Try searching for a different GitHub username.</p>
                    </div>
                `;
            }
        }

        function displayResults(userData, reposData) {
            // Format numbers with commas
            const formatNumber = (num) => num.toLocaleString();
            
            // Create user info HTML
            const userHTML = `
                <div class="user-card">
                    <div class="user-header">
                        <img src="${userData.avatar_url}" alt="${userData.username}" class="avatar">
                        <div class="user-info">
                            <h2>${userData.name || userData.username}</h2>
                            <p>@${userData.username}</p>
                        </div>
                    </div>
                    
                    <p style="margin-bottom: 20px; color: #555;">${userData.bio}</p>
                    
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-value">${formatNumber(userData.public_repos)}</span>
                            <span class="stat-label">Repositories</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">${formatNumber(userData.followers)}</span>
                            <span class="stat-label">Followers</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-value">${formatNumber(userData.following)}</span>
                            <span class="stat-label">Following</span>
                        </div>
                    </div>
                    
                    <div class="details">
                        <p>📍 <strong>Location:</strong> ${userData.location}</p>
                        <p>📅 <strong>Joined:</strong> ${userData.created_at}</p>
                        ${userData.blog !== 'N/A' ? `<p>🔗 <strong>Blog:</strong> <a href="${userData.blog}" target="_blank">${userData.blog}</a></p>` : ''}
                        <p style="margin-top: 20px;">
                            <a href="${userData.html_url}" target="_blank" style="background: #333; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; display: inline-flex; align-items: center;">
                                <span class="github-icon">🐙</span>
                                View on GitHub
                            </a>
                        </p>
                    </div>
                </div>
            `;

            // Create repos HTML
            let reposHTML = '';
            if (reposData.error) {
                reposHTML = `<div class="error"><p>${reposData.error}</p></div>`;
            } else {
                reposHTML = `
                    <div class="repos-card">
                        <h3 style="margin-bottom: 20px; color: #333; font-size: 1.5em;">Latest Repositories</h3>
                        <ul class="repo-list">
                            ${reposData.map(repo => `
                                <li class="repo-item">
                                    <div class="repo-header">
                                        <a href="${repo.html_url}" target="_blank" class="repo-name">${repo.name}</a>
                                        <div class="repo-stats">
                                            <span>⭐ ${formatNumber(repo.stars)}</span>
                                            <span>🍴 ${formatNumber(repo.forks)}</span>
                                            <span>${repo.language}</span>
                                        </div>
                                    </div>
                                    <p class="repo-desc">${repo.description}</p>
                                    <small style="color: #888; margin-top: 10px; display: block;">
                                        Updated: ${repo.updated_at}
                                    </small>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
            }

            document.getElementById('resultsContainer').innerHTML = userHTML + reposHTML;
        }

        // Load default user on page load
        document.addEventListener('DOMContentLoaded', () => {
            fetchUserData('torvalds');
        });
    </script>
</body>
</html>
